name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependency advisories
        run: cargo audit

  publish-tauri:
    name: Publish ${{ matrix.platform }}
    needs: cargo-audit
    permissions:
      # tauri-action creates the GitHub release and uploads the build assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            trunk-artifact: trunk-x86_64-pc-windows-msvc.zip
          - platform: ubuntu-24.04
            args: ""
            trunk-artifact: trunk-x86_64-unknown-linux-gnu.tar.gz
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            trunk-artifact: trunk-aarch64-apple-darwin.tar.gz

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Trunk
        shell: bash
        env:
          TRUNK_ARTIFACT: ${{ matrix.trunk-artifact }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CURL=curl.exe
            ARCHIVE=trunk.zip
          else
            CURL=curl
            ARCHIVE=trunk.tar.gz
          fi
          for attempt in 1 2 3 4; do
            $CURL -LsSf \
              "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/$TRUNK_ARTIFACT" \
              -o "$ARCHIVE" \
              && mkdir -p "$HOME/.cargo/bin" \
              && if [ "$RUNNER_OS" = "Windows" ]; then
                   powershell -Command "Expand-Archive -Force -Path trunk.zip -DestinationPath trunk-extract"
                   cp trunk-extract/trunk.exe "$HOME/.cargo/bin/"
                 else
                   tar -xzf "$ARCHIVE" -C "$HOME/.cargo/bin"
                 fi \
              && break
            echo "trunk download failed (attempt $attempt/4) - retrying in 10s"
            sleep 10
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -x "$HOME/.cargo/bin/trunk.exe"
          else
            test -x "$HOME/.cargo/bin/trunk"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/drug-ya-app
          tagName: v__VERSION__
          releaseName: "Drug-Ya v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
