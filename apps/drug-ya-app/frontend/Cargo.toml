[package]
name = "drug-ya-frontend"
description = "Drug-Ya Leptos 0.8 CSR frontend (compiled to WASM via trunk)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
drug-ya-core = { workspace = true }
drug-ya-bridge = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "Node", "NodeList"] }
console_error_panic_hook = "0.1"
